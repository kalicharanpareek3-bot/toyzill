<!DOCTYPE html>
<html>
<head>
  <title>All Toys – TOYZILL</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="header">
  <div class="logo">TOYZILL</div>
</div>

<h2 style="text-align:center">All Toys</h2>

<div class="product-grid" id="productList"></div>

<script src="js/data.js"></script>
<script>
let html = "";
products.forEach(p=>{
  html += `
  <div class="product-card">
    <img src="${p.img}">
    <h3>${p.name}</h3>
    <p>₹${p.price}</p>
    <a href="product.html?id=${p.id}">View Details</a>
  </div>`;
});
document.getElementById("productList").innerHTML = html;
</script>

</body>
</html>
